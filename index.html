<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA / Fullscreen Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Nightscout Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js & Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* 画面焼け防止: 背景色のゆっくりとした変化 */
        @keyframes bg-breathe {
            0% { background-color: #000000; }
            50% { background-color: #0f172a; } /* 暗いスレート */
            100% { background-color: #000000; }
        }

        body {
            background-color: #000000;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            overflow: hidden; /* デフォルトはスクロールなし */
            height: 100dvh; /* 動的ビューポートの高さ */
            width: 100vw;
            animation: bg-breathe 60s infinite alternate ease-in-out;
            transition: filter 1s ease-in-out;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #shift-container {
            width: 100%;
            height: 100%;
            transition: transform 1s ease-in-out;
        }

        #grid-container {
            display: grid;
            gap: 0.5rem;
            padding: 0.5rem;
            height: 100%;
            width: 100%;
            box-sizing: border-box;
            transition: all 1s ease-in-out;
        }

        /* 画面レイアウトパターン */
        .layout-pattern-0 {
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: minmax(160px, 1fr) 2fr;
            grid-template-areas: 
                "current today seven"
                "graph graph graph";
        }
        .layout-pattern-1 {
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 2fr minmax(160px, 1fr);
            grid-template-areas: 
                "graph graph graph"
                "current today seven";
        }
        .layout-pattern-2 {
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-areas: 
                "graph current"
                "graph today"
                "graph seven";
        }
        .layout-pattern-3 {
            grid-template-columns: 1fr 2fr;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-areas: 
                "current graph"
                "today graph"
                "seven graph";
        }

        /* モバイル縦長画面向けレスポンシブ */
        @media (max-width: 768px) {
            body { overflow-y: auto; } /* スクロール許可 */
            #shift-container { height: auto; min-height: 100dvh; }
            #grid-container {
                display: flex;
                flex-direction: column;
                height: auto;
            }
            .area-graph { min-height: 280px; order: 4; }
            .area-current { min-height: 160px; order: 1; }
            .area-today { order: 2; }
            .area-seven { order: 3; }
            .panel { flex: none; margin-bottom: 0.5rem; }
        }

        .area-current { grid-area: current; }
        .area-today { grid-area: today; }
        .area-seven { grid-area: seven; }
        .area-graph { grid-area: graph; min-height: 0; min-width: 0; }

        .panel {
            background-color: rgba(15, 23, 42, 0.8);
            border-radius: 0.75rem;
            border: 1px solid rgba(71, 85, 105, 0.4);
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(4px);
            overflow: hidden;
        }

        /* 動的フォントサイズ (vw使用) */
        .dynamic-bg-text { font-size: clamp(4rem, 8vw, 10rem); line-height: 1; }
        .dynamic-arrow-text { font-size: clamp(3rem, 6vw, 8rem); line-height: 1; }

        @media (max-width: 768px) {
            .dynamic-bg-text { font-size: 5rem; }
            .dynamic-arrow-text { font-size: 4rem; }
        }

        #settings-modal { background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); }

        #custom-tooltip {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(71, 85, 105, 0.6);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -100%);
            margin-top: -10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

<div id="shift-container">
    <div id="grid-container" class="layout-pattern-0">
        
        <!-- CURRENT BG PANEL -->
        <div class="panel area-current relative flex flex-col justify-center items-center">
            <button id="btn-settings" class="absolute top-2 right-2 text-slate-400 hover:text-white p-2 z-10">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
            
            <div class="flex flex-col items-center mb-1">
                <div class="text-[10px] md:text-xs text-slate-500" id="sync-time">Sync: --:--</div>
                <div class="text-xs md:text-sm text-blue-400 font-bold uppercase mt-0.5" id="last-update-time">Loading...</div>
            </div>
            
            <div class="flex-1 flex flex-col justify-center items-center w-full mt-1">
                <div class="flex items-center justify-center gap-2 md:gap-4 w-full">
                    <div id="current-bg" class="dynamic-bg-text font-black tabular-nums tracking-tighter">---</div>
                    <div id="trend-arrow" class="dynamic-arrow-text font-black"></div>
                </div>
                <div id="bg-delta" class="text-lg md:text-xl text-slate-400 mt-1 font-medium">--</div>
            </div>
            
            <div id="error-message" class="text-red-400 text-xs mt-2 hidden text-center bg-red-900/30 p-1.5 rounded w-full"></div>
        </div>

        <!-- TODAY PANEL -->
        <div class="panel area-today flex flex-col justify-between">
            <h2 class="text-xs md:text-sm font-bold text-slate-200 mb-1 border-b border-slate-700 pb-1 flex items-center gap-1.5">
                <i data-lucide="calendar" class="w-4 h-4 text-blue-400"></i>本日 (0:00-)
            </h2>
            
            <div class="flex-1 flex flex-col justify-between gap-1">
                <div class="flex flex-col gap-0.5">
                    <div class="flex justify-between text-[10px] md:text-xs font-medium text-slate-400 px-1">
                        <span>Low</span><span>In Range</span><span>High</span>
                    </div>
                    <div class="flex h-2 md:h-3 w-full rounded-full overflow-hidden bg-slate-800">
                        <div id="td-tbr" class="bg-red-500 h-full transition-all" style="width: 0%"></div>
                        <div id="td-tir" class="bg-green-500 h-full transition-all" style="width: 0%"></div>
                        <div id="td-tar" class="bg-yellow-500 h-full transition-all" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-[10px] md:text-xs font-bold px-1">
                        <span class="text-red-400" id="td-tbr-val">0%</span>
                        <span class="text-green-400" id="td-tir-val">0%</span>
                        <span class="text-yellow-400" id="td-tar-val">0%</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-1 bg-slate-800/60 rounded p-1 border border-slate-700/50">
                    <div class="flex flex-col items-center justify-center border-r border-slate-700/50 pr-1">
                        <span class="text-[9px] md:text-[10px] text-slate-400 uppercase font-semibold">Avg/CV</span>
                        <div class="text-sm md:text-lg font-black text-slate-200"><span id="td-mean">0</span></div>
                        <div class="text-[9px] font-bold text-slate-400">(<span id="td-cv">0</span>%)</div>
                    </div>
                    <div class="flex flex-col items-center justify-center border-r border-slate-700/50 px-1">
                        <span class="text-[9px] md:text-[10px] text-slate-400 uppercase font-semibold">TDD</span>
                        <div class="text-sm md:text-lg font-black text-blue-300">
                            <span id="td-tdd">0.0</span><span class="text-[10px] font-normal ml-0.5">U</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-center justify-center pl-1">
                        <span class="text-[9px] md:text-[10px] text-slate-400 uppercase font-semibold">Carbs</span>
                        <div class="text-sm md:text-lg font-black text-yellow-300">
                            <span id="td-carbs">0</span><span class="text-[10px] font-normal ml-0.5">g</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-0.5">
                    <div class="flex h-2 md:h-2.5 w-full rounded-full overflow-hidden bg-slate-800">
                        <div id="td-basal-bar" class="bg-slate-400 h-full transition-all" style="width: 0%"></div>
                        <div id="td-smb-bar" class="bg-purple-500 h-full transition-all" style="width: 0%"></div>
                        <div id="td-bolus-bar" class="bg-cyan-400 h-full transition-all" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-center px-1">
                        <div class="flex flex-col items-start">
                            <span class="text-[9px] text-slate-400 uppercase">Basal</span>
                            <span class="text-[10px] md:text-xs font-bold text-slate-300" id="td-basal">0.0</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] text-slate-400 uppercase">SMB</span>
                            <span class="text-[10px] md:text-xs font-bold text-purple-400" id="td-smb">0.0</span>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-[9px] text-slate-400 uppercase">Bolus</span>
                            <span class="text-[10px] md:text-xs font-bold text-cyan-300" id="td-bolus">0.0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 7 DAYS PANEL -->
        <div class="panel area-seven flex flex-col justify-between">
            <h2 class="text-xs md:text-sm font-bold text-slate-200 mb-1 border-b border-slate-700 pb-1 flex items-center gap-1.5">
                <i data-lucide="calendar-days" class="w-4 h-4 text-purple-400"></i>過去7日 Avg
            </h2>
            
            <div class="flex-1 flex flex-col justify-between gap-1">
                <div class="flex flex-col gap-0.5">
                    <div class="flex justify-between text-[10px] md:text-xs font-medium text-slate-400 px-1">
                        <span>Low</span><span>In Range</span><span>High</span>
                    </div>
                    <div class="flex h-2 md:h-3 w-full rounded-full overflow-hidden bg-slate-800">
                        <div id="7d-tbr" class="bg-red-500 h-full transition-all" style="width: 0%"></div>
                        <div id="7d-tir" class="bg-green-500 h-full transition-all" style="width: 0%"></div>
                        <div id="7d-tar" class="bg-yellow-500 h-full transition-all" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-[10px] md:text-xs font-bold px-1">
                        <span class="text-red-400" id="7d-tbr-val">0%</span>
                        <span class="text-green-400" id="7d-tir-val">0%</span>
                        <span class="text-yellow-400" id="7d-tar-val">0%</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-1 bg-slate-800/60 rounded p-1 border border-slate-700/50">
                    <div class="flex flex-col items-center justify-center border-r border-slate-700/50 pr-1">
                        <span class="text-[9px] md:text-[10px] text-slate-400 uppercase font-semibold">Avg/CV</span>
                        <div class="text-sm md:text-lg font-black text-slate-200"><span id="7d-mean">0</span></div>
                        <div class="text-[9px] font-bold text-slate-400">(<span id="7d-cv">0</span>%)</div>
                    </div>
                    <div class="flex flex-col items-center justify-center border-r border-slate-700/50 px-1">
                        <span class="text-[9px] md:text-[10px] text-slate-400 uppercase font-semibold">TDD</span>
                        <div class="text-sm md:text-lg font-black text-blue-300">
                            <span id="7d-tdd">0.0</span><span class="text-[10px] font-normal ml-0.5">U</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-center justify-center pl-1">
                        <span class="text-[9px] md:text-[10px] text-slate-400 uppercase font-semibold">Carbs</span>
                        <div class="text-sm md:text-lg font-black text-yellow-300">
                            <span id="7d-carbs">0</span><span class="text-[10px] font-normal ml-0.5">g</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-0.5">
                    <div class="flex h-2 md:h-2.5 w-full rounded-full overflow-hidden bg-slate-800">
                        <div id="7d-basal-bar" class="bg-slate-400 h-full transition-all" style="width: 0%"></div>
                        <div id="7d-smb-bar" class="bg-purple-500 h-full transition-all" style="width: 0%"></div>
                        <div id="7d-bolus-bar" class="bg-cyan-400 h-full transition-all" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-center px-1">
                        <div class="flex flex-col items-start">
                            <span class="text-[9px] text-slate-400 uppercase">Basal</span>
                            <span class="text-[10px] md:text-xs font-bold text-slate-300" id="7d-basal">0.0</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] text-slate-400 uppercase">SMB</span>
                            <span class="text-[10px] md:text-xs font-bold text-purple-400" id="7d-smb">0.0</span>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-[9px] text-slate-400 uppercase">Bolus</span>
                            <span class="text-[10px] md:text-xs font-bold text-cyan-300" id="7d-bolus">0.0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CHART PANEL -->
        <div class="panel area-graph flex flex-col">
            <div class="flex justify-between items-center mb-1 px-1">
                <div class="flex items-center gap-1">
                    <button id="btn-prev" class="p-1 bg-slate-700/50 hover:bg-slate-600 rounded text-white"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <span id="chart-date-label" class="font-bold text-slate-300 w-24 text-center text-xs md:text-sm">Today</span>
                    <button id="btn-next" class="p-1 bg-slate-700/50 hover:bg-slate-600 rounded text-white opacity-50 cursor-not-allowed" disabled><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
                <div class="flex bg-slate-800/80 rounded border border-slate-700/50 p-0.5 text-xs md:text-sm font-medium">
                    <button class="time-btn px-2 py-0.5 md:px-3 md:py-1 rounded transition" data-hours="3">3h</button>
                    <button class="time-btn px-2 py-0.5 md:px-3 md:py-1 rounded transition bg-slate-600 text-white shadow" data-hours="6">6h</button>
                    <button class="time-btn px-2 py-0.5 md:px-3 md:py-1 rounded transition" data-hours="12">12h</button>
                    <button class="time-btn px-2 py-0.5 md:px-3 md:py-1 rounded transition" data-hours="24">24h</button>
                </div>
            </div>
            <div class="flex-1 relative w-full h-full min-h-0">
                <canvas id="bgChart"></canvas>
            </div>
        </div>

    </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 rounded-xl max-w-sm w-full p-6 border border-slate-700 shadow-2xl">
        <h2 class="text-lg font-bold mb-4 text-white flex items-center gap-2">
            <i data-lucide="settings" class="w-5 h-5"></i>設定
        </h2>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Nightscout URL</label>
                <input type="text" id="ns-url" placeholder="https://..." class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">API Secret / Token (任意)</label>
                <input type="password" id="ns-secret" placeholder="Secret or Token" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
            <button id="btn-cancel-settings" class="px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-700">キャンセル</button>
            <button id="btn-save-settings" class="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded font-bold">保存 & 接続</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    const state = {
        url: localStorage.getItem('ns-url') || '',
        secret: localStorage.getItem('ns-secret') || '',
        data: { entries: [], treatments: [], profile: null },
        timeRangeHours: 6,
        offsetDays: 0,
        lastFetchAt: null,
    };

    const FULL_LOOKBACK_DAYS = 8;
    const DELTA_LOOKBACK_MINUTES = 90;
    const REFRESH_INTERVAL_MS = 3 * 60 * 1000; // 3 mins
    const DATA_RETENTION_DAYS = 8;

    let chartInstance = null;
    let fetchInterval = null;
    let tooltipEl = null;

    function initTooltip() {
        tooltipEl = document.getElementById('custom-tooltip');
        if (!tooltipEl) {
            tooltipEl = document.createElement('div');
            tooltipEl.id = 'custom-tooltip';
            tooltipEl.className = 'hidden';
            document.body.appendChild(tooltipEl);
        }
    }
    initTooltip();

    // 1. Layout Shuffle
    let currentLayoutPattern = 0;
    setInterval(() => {
        const container = document.getElementById('grid-container');
        container.classList.remove(`layout-pattern-${currentLayoutPattern}`);
        currentLayoutPattern = (currentLayoutPattern + 1) % 4;
        container.classList.add(`layout-pattern-${currentLayoutPattern}`);
        if(chartInstance) chartInstance.resize();
    }, 10 * 60 * 1000);

    // 2. Micro Shift
    setInterval(() => {
        const shiftX = Math.floor(Math.random() * 7) - 3;
        const shiftY = Math.floor(Math.random() * 7) - 3;
        document.getElementById('shift-container').style.transform = `translate(${shiftX}px, ${shiftY}px)`;
    }, 60 * 1000);

    // 3. Idle Dim
    let idleTimer = 0;
    const resetIdle = () => {
        idleTimer = 0;
        document.body.style.filter = 'brightness(100%)';
    };
    ['mousemove', 'touchstart', 'click', 'keydown'].forEach(evt => document.addEventListener(evt, resetIdle));
    
    setInterval(() => {
        idleTimer++;
        if (idleTimer >= 3) document.body.style.filter = 'brightness(75%)';
    }, 60 * 1000);

    document.getElementById('btn-settings').addEventListener('click', () => {
        document.getElementById('ns-url').value = state.url;
        document.getElementById('ns-secret').value = state.secret;
        document.getElementById('settings-modal').classList.remove('hidden');
    });

    document.getElementById('btn-cancel-settings').addEventListener('click', () => {
        document.getElementById('settings-modal').classList.add('hidden');
    });

    document.getElementById('btn-save-settings').addEventListener('click', () => {
        state.url = document.getElementById('ns-url').value.trim().replace(/\/$/, '');
        state.secret = document.getElementById('ns-secret').value.trim();
        localStorage.setItem('ns-url', state.url);
        localStorage.setItem('ns-secret', state.secret);
        document.getElementById('settings-modal').classList.add('hidden');
        initApp();
    });

    document.querySelectorAll('.time-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.time-btn').forEach(b => {
                b.classList.remove('bg-slate-600', 'text-white', 'shadow');
                b.classList.add('text-slate-400');
            });
            e.target.classList.add('bg-slate-600', 'text-white', 'shadow');
            e.target.classList.remove('text-slate-400');
            state.timeRangeHours = parseInt(e.target.dataset.hours);
            updateChart();
        });
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
        if(state.offsetDays < 7) { state.offsetDays++; updateChart(); updateDateControls(); }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
        if(state.offsetDays > 0) { state.offsetDays--; updateChart(); updateDateControls(); }
    });

    function updateDateControls() {
        const btnNext = document.getElementById('btn-next');
        const btnPrev = document.getElementById('btn-prev');
        const label = document.getElementById('chart-date-label');

        btnNext.disabled = state.offsetDays === 0;
        btnNext.classList.toggle('opacity-50', btnNext.disabled);
        btnNext.classList.toggle('cursor-not-allowed', btnNext.disabled);

        btnPrev.disabled = state.offsetDays === 7;
        btnPrev.classList.toggle('opacity-50', btnPrev.disabled);
        btnPrev.classList.toggle('cursor-not-allowed', btnPrev.disabled);

        if(state.offsetDays === 0) label.textContent = "Today";
        else if (state.offsetDays === 1) label.textContent = "Yesterday";
        else label.textContent = `${state.offsetDays} days ago`;
    }

    async function fetchAPI(endpoint) {
        if(!state.url) return null;
        const headers = { 'Accept': 'application/json' };
        if(state.secret) headers['API-SECRET'] = state.secret;
        
        try {
            const response = await fetch(`${state.url}${endpoint}`, { headers });
            if(!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        } catch (error) {
            console.error("API Error:", error);
            showError("接続失敗。URLを確認してください。");
            return null;
        }
    }

    function showError(msg) {
        const errDiv = document.getElementById('error-message');
        errDiv.textContent = msg;
        errDiv.classList.remove('hidden');
    }

    function hideError() { document.getElementById('error-message').classList.add('hidden'); }

    function mergeByKey(existing, incoming, keyFn) {
        const map = new Map();
        existing.forEach(item => map.set(keyFn(item), item));
        incoming.forEach(item => map.set(keyFn(item), item));
        return Array.from(map.values());
    }

    async function fetchAllData(forceFull = false) {
        if(!state.url || document.hidden) return;

        const fromDate = new Date();
        const shouldFullFetch = forceFull || state.data.entries.length === 0;

        if(shouldFullFetch) fromDate.setDate(fromDate.getDate() - FULL_LOOKBACK_DAYS);
        else fromDate.setMinutes(fromDate.getMinutes() - DELTA_LOOKBACK_MINUTES);

        const fromStr = fromDate.toISOString();
        document.getElementById('last-update-time').textContent = 'Updating...';

        try {
            if(!state.data.profile || shouldFullFetch) {
                const profiles = await fetchAPI('/api/v1/profile.json');
                if(profiles && profiles.length > 0) state.data.profile = profiles[0].store[profiles[0].defaultProfile];
            }

            const [entriesData, treatsData] = await Promise.all([
                fetchAPI(`/api/v1/entries.json?find[dateString][$gte]=${encodeURIComponent(fromStr)}&count=10000`),
                fetchAPI(`/api/v1/treatments.json?find[created_at][$gte]=${encodeURIComponent(fromStr)}&count=10000`)
            ]);

            if(entriesData && treatsData) {
                state.data.entries = mergeByKey(state.data.entries, entriesData, e => e._id || e.date)
                    .sort((a,b) => (a.date || new Date(a.dateString).getTime()) - (b.date || new Date(b.dateString).getTime()));

                state.data.treatments = mergeByKey(state.data.treatments, treatsData, t => t._id || t.created_at)
                    .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

                // Prune
                const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - DATA_RETENTION_DAYS);
                state.data.entries = state.data.entries.filter(e => new Date(e.dateString) >= cutoff);
                state.data.treatments = state.data.treatments.filter(t => new Date(t.created_at) >= cutoff);

                hideError();
                updateUI();
                
                const now = new Date();
                document.getElementById('sync-time').textContent = `Sync: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            }
        } catch(e) {
            console.error("Fetch failed", e);
        }
    }

    const getDirectionArrow = (dir) => {
        const arrows = { 'NONE': '⇼', 'DoubleUp': '⇈', 'SingleUp': '↑', 'FortyFiveUp': '↗', 'Flat': '→', 'FortyFiveDown': '↘', 'SingleDown': '↓', 'DoubleDown': '⇊', 'Not Computable': '-', 'Rate Out Of Range': '⇕' };
        return arrows[dir] || '';
    };

    const getBgColorClass = (sgv) => {
        if (sgv < 55) return 'text-red-600';
        if (sgv < 70) return 'text-red-400';
        if (sgv > 250) return 'text-yellow-600';
        if (sgv > 180) return 'text-yellow-400';
        return 'text-green-400';
    };

    function updateUI() {
        const entries = state.data.entries;
        if(entries.length === 0) return;

        const latest = entries[entries.length - 1];
        const currentBgEl = document.getElementById('current-bg');
        currentBgEl.textContent = latest.sgv;
        
        const colorClass = getBgColorClass(latest.sgv);
        currentBgEl.className = currentBgEl.className.replace(/text-(red|yellow|green)-\d+/, '');
        currentBgEl.classList.add(colorClass);
        
        const arrowEl = document.getElementById('trend-arrow');
        arrowEl.textContent = getDirectionArrow(latest.direction);
        arrowEl.className = arrowEl.className.replace(/text-(red|yellow|green)-\d+/, '');
        arrowEl.classList.add(colorClass);
        
        if(entries.length > 1) {
            const prev = entries[entries.length - 2];
            const delta = latest.sgv - prev.sgv;
            document.getElementById('bg-delta').textContent = `${delta >= 0 ? '+' : ''}${delta} mg/dL`;
        }

        const timeDiff = Math.floor((new Date() - new Date(latest.dateString)) / 60000);
        document.getElementById('last-update-time').textContent = `${timeDiff} min ago`;

        calculateSummaries();
        updateChart();
    }

    function calculateSummaries() {
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const todayEnd = new Date(todayStart); todayEnd.setDate(todayEnd.getDate() + 1);
        renderStats('td', calcStatsForPeriod(todayStart, todayEnd), 1);

        const sevenDaysAgo = new Date(todayStart); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        renderStats('7d', calcStatsForPeriod(sevenDaysAgo, todayEnd), 7);
    }

    function calcStatsForPeriod(startDate, endDate) {
        const pEntries = state.data.entries.filter(e => { const d = new Date(e.dateString); return d >= startDate && d < endDate; });
        const pTreats = state.data.treatments.filter(t => { const d = new Date(t.created_at); return d >= startDate && d < endDate; });

        let tbr = 0, tir = 0, tar = 0, sum = 0, mean = 0, sd = 0, cv = 0;
        const total = pEntries.length;
        
        if(total > 0) {
            tbr = pEntries.filter(e => e.sgv < 70).length / total * 100;
            tir = pEntries.filter(e => e.sgv >= 70 && e.sgv <= 180).length / total * 100;
            tar = pEntries.filter(e => e.sgv > 180).length / total * 100;
            
            pEntries.forEach(e => sum += e.sgv);
            mean = sum / total;
            
            let sumSqDiff = 0;
            pEntries.forEach(e => sumSqDiff += Math.pow(e.sgv - mean, 2));
            sd = Math.sqrt(sumSqDiff / total);
            cv = (sd / mean) * 100;
        }

        let totalCarbs = 0, bolus = 0, smb = 0;
        pTreats.forEach(t => {
            if(t.carbs) totalCarbs += t.carbs;
            if(t.insulin) {
                if(t.insulin <= 0.4 || t.eventType === 'SMB' || t.isSMB) smb += t.insulin;
                else if (!t.eventType || t.eventType === 'Correction Bolus' || t.eventType === 'Meal Bolus') bolus += t.insulin;
            }
        });

        const basal = calculateIntegralBasal(startDate, endDate, pTreats);
        const tdd = basal + bolus + smb;

        return { tbr, tir, tar, carbs: totalCarbs, bolus, smb, basal, tdd, mean, cv };
    }

    function calculateIntegralBasal(startDate, endDate, periodTreats) {
        if(!state.data.profile || !state.data.profile.basal) return 0;
        
        let totalBasalUnits = 0;
        const profileBasals = state.data.profile.basal;
        const tempBasals = periodTreats.filter(t => t.eventType === 'Temp Basal' && t.duration > 0 && t.absolute !== undefined);

        let currentIter = new Date(startDate);
        const endIter = new Date(endDate);
        if(endIter > new Date()) endIter.setTime(new Date().getTime());

        while(currentIter < endIter) {
            const iterTimeMs = currentIter.getTime();
            const secondsSinceMidnight = (currentIter.getHours() * 3600) + (currentIter.getMinutes() * 60);
            
            let currentRate = profileBasals[0].value;
            for(let i = profileBasals.length - 1; i >= 0; i--) {
                if(secondsSinceMidnight >= profileBasals[i].timeAsSeconds) { currentRate = profileBasals[i].value; break; }
            }

            for(const tb of tempBasals) {
                const tbStart = new Date(tb.created_at).getTime();
                if(iterTimeMs >= tbStart && iterTimeMs < tbStart + (tb.duration * 60000)) {
                    currentRate = tb.absolute; break;
                }
            }
            totalBasalUnits += (currentRate / 60);
            currentIter.setMinutes(currentIter.getMinutes() + 1);
        }
        return totalBasalUnits;
    }

    function renderStats(prefix, stats, daysDivider) {
        document.getElementById(`${prefix}-tbr`).style.width = `${stats.tbr}%`;
        document.getElementById(`${prefix}-tir`).style.width = `${stats.tir}%`;
        document.getElementById(`${prefix}-tar`).style.width = `${stats.tar}%`;
        
        document.getElementById(`${prefix}-tbr-val`).textContent = `${Math.round(stats.tbr)}%`;
        document.getElementById(`${prefix}-tir-val`).textContent = `${Math.round(stats.tir)}%`;
        document.getElementById(`${prefix}-tar-val`).textContent = `${Math.round(stats.tar)}%`;

        const tdd = stats.tdd / daysDivider, basal = stats.basal / daysDivider, bolus = stats.bolus / daysDivider, smb = stats.smb / daysDivider;

        document.getElementById(`${prefix}-tdd`).textContent = tdd.toFixed(1);
        document.getElementById(`${prefix}-basal`).textContent = basal.toFixed(1);
        document.getElementById(`${prefix}-bolus`).textContent = bolus.toFixed(1);
        document.getElementById(`${prefix}-smb`).textContent = smb.toFixed(1);
        document.getElementById(`${prefix}-carbs`).textContent = Math.round(stats.carbs / daysDivider);
        document.getElementById(`${prefix}-mean`).textContent = Math.round(stats.mean);
        document.getElementById(`${prefix}-cv`).textContent = stats.cv.toFixed(1);

        if(tdd > 0) {
            document.getElementById(`${prefix}-basal-bar`).style.width = `${(basal/tdd)*100}%`;
            document.getElementById(`${prefix}-bolus-bar`).style.width = `${(bolus/tdd)*100}%`;
            document.getElementById(`${prefix}-smb-bar`).style.width = `${(smb/tdd)*100}%`;
        } else {
            document.getElementById(`${prefix}-basal-bar`).style.width = '0%';
            document.getElementById(`${prefix}-bolus-bar`).style.width = '0%';
            document.getElementById(`${prefix}-smb-bar`).style.width = '0%';
        }
    }

    function updateChart() {
        if(!state.data.entries.length) return;
        const ctx = document.getElementById('bgChart').getContext('2d');
        
        const targetEnd = new Date(); targetEnd.setDate(targetEnd.getDate() - state.offsetDays);
        const targetStart = new Date(targetEnd); targetStart.setHours(targetStart.getHours() - state.timeRangeHours);

        const pEntries = state.data.entries.filter(e => { const d = new Date(e.dateString); return d >= targetStart && d <= targetEnd; });
        const pTreats = state.data.treatments.filter(t => { const d = new Date(t.created_at); return d >= targetStart && d <= targetEnd; });

        const scatterData = pEntries.map(e => ({ x: new Date(e.dateString).getTime(), y: e.sgv }));
        const yAxisMax = Math.max(250, ...scatterData.map(d => d.y)) + 30; 
        const yAxisMin = 40;

        const annotations = {
            targetRange: { type: 'box', yMin: 70, yMax: 180, backgroundColor: 'rgba(74, 222, 128, 0.1)', borderWidth: 0, drawTime: 'beforeDatasetsDraw' }
        };

        pTreats.forEach((t, i) => {
            const time = new Date(t.created_at).getTime();
            if(t.carbs) {
                const p = Math.max(2, Math.sqrt(t.carbs) * 1.5);
                annotations[`carb_${i}`] = {
                    type: 'label', xValue: time, yValue: yAxisMax - 25,
                    backgroundColor: 'rgba(234, 179, 8, 0.7)', color: '#fff',
                    content: `${t.carbs}`, font: { size: 9, weight: 'bold' },
                    borderRadius: 999, padding: { top: p, bottom: p, left: p+2, right: p+2 },
                    enter(ctx, event) {
                        const d = new Date(time);
                        tooltipEl.innerHTML = `<div class="font-bold text-yellow-400 mb-1">Carbs: ${t.carbs}g</div><div class="text-slate-300 text-xs">${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}</div>`;
                        tooltipEl.style.left = event.x + 'px'; tooltipEl.style.top = event.y + 'px';
                        tooltipEl.classList.remove('hidden');
                    },
                    leave() { tooltipEl.classList.add('hidden'); }
                };
            }
            if(t.insulin) {
                const isSMB = (t.insulin <= 0.4 || t.eventType === 'SMB' || t.isSMB);
                const color = isSMB ? 'rgba(168, 85, 247, 0.7)' : 'rgba(6, 182, 212, 0.7)';
                const p = Math.max(2, Math.sqrt(t.insulin) * 3);
                annotations[`ins_${i}`] = {
                    type: 'label', xValue: time, yValue: yAxisMin + 15,
                    backgroundColor: color, color: '#fff',
                    content: `${t.insulin}`, font: { size: 9, weight: 'bold' },
                    borderRadius: 999, padding: { top: p, bottom: p, left: p+2, right: p+2 },
                    enter(ctx, event) {
                        const d = new Date(time);
                        tooltipEl.innerHTML = `<div class="font-bold ${isSMB?'text-purple-400':'text-cyan-400'} mb-1">${isSMB?'SMB':'Bolus'}: ${t.insulin}U</div><div class="text-slate-300 text-xs">${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}</div>`;
                        tooltipEl.style.left = event.x + 'px'; tooltipEl.style.top = event.y + 'px';
                        tooltipEl.classList.remove('hidden');
                    },
                    leave() { tooltipEl.classList.add('hidden'); }
                };
            }
        });

        const basalData = [];
        if(state.data.profile && state.data.profile.basal) {
            let iter = new Date(targetStart); iter.setMinutes(0,0,0);
            while(iter <= targetEnd) {
                const iterTime = iter.getTime(), secondsSinceMidnight = (iter.getHours() * 3600) + (iter.getMinutes() * 60);
                let rate = state.data.profile.basal[0].value;
                for(let i = state.data.profile.basal.length - 1; i >= 0; i--) {
                    if(secondsSinceMidnight >= state.data.profile.basal[i].timeAsSeconds) { rate = state.data.profile.basal[i].value; break; }
                }
                const tb = pTreats.find(t => t.eventType === 'Temp Basal' && iterTime >= new Date(t.created_at).getTime() && iterTime < new Date(t.created_at).getTime() + (t.duration * 60000));
                if(tb && tb.absolute !== undefined) rate = tb.absolute;
                basalData.push({ x: iterTime, y: rate * 30 }); 
                iter.setMinutes(iter.getMinutes() + 5);
            }
        }

        if(chartInstance) chartInstance.destroy();
        Chart.defaults.color = '#64748b';
        Chart.defaults.font.family = 'Inter, sans-serif';

        chartInstance = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    { label: 'BG', data: scatterData, backgroundColor: (ctx) => { const y=ctx.raw?.y; return y<70?'#f87171':y>180?'#facc15':'#4ade80'; }, pointRadius: 2, order: 1 },
                    { type: 'line', label: 'Basal', data: basalData, borderColor: 'rgba(59, 130, 246, 0.4)', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 1, fill: true, stepped: true, pointRadius: 0, order: 2, yAxisID: 'y' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                interaction: { mode: 'nearest', intersect: false },
                plugins: { 
                    legend: { display: false }, 
                    tooltip: { enabled: true, callbacks: { label: (ctx) => ctx.dataset.label==='BG'?`BG: ${ctx.raw.y}`:`Basal: ${(ctx.raw.y/30).toFixed(2)}U/h` } }, 
                    annotation: { annotations } 
                },
                layout: { padding: { left: 0, right: 5, top: 10, bottom: 0 } },
                scales: {
                    x: { type: 'time', time: { unit: 'hour', displayFormats: { hour: 'HH:mm' } }, min: targetStart.getTime(), max: targetEnd.getTime(), grid: { color: 'rgba(51, 65, 85, 0.3)' }, ticks: { font: { size: 10 } } },
                    y: { min: yAxisMin, max: yAxisMax, grid: { color: 'rgba(51, 65, 85, 0.3)' }, ticks: { font: { size: 10 } } }
                }
            }
        });
    }

    function initApp() {
        if(!state.url) { document.getElementById('settings-modal').classList.remove('hidden'); return; }
        fetchAllData(true);
        if(fetchInterval) clearInterval(fetchInterval);
        fetchInterval = setInterval(() => { if(state.offsetDays === 0) fetchAllData(false); }, REFRESH_INTERVAL_MS);
    }

    document.addEventListener('visibilitychange', () => {
        if(!document.hidden && state.url && state.offsetDays === 0) fetchAllData(false);
    });

    initApp();
</script>
