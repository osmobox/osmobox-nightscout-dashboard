    <style>
        /* 画面焼け防止: 背景色のゆっくりとした変化 */
        @keyframes bg-breathe {
            0% { background-color: #000000; }
            50% { background-color: #0f172a; } /* 暗いスレート */
            100% { background-color: #000000; }
        }

        body {
            background-color: #000000;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            overflow: hidden; /* デフォルトはスクロールさせない */
            height: 100dvh; /* dynamic viewport height */
            width: 100vw;
            animation: bg-breathe 60s infinite alternate ease-in-out;
            transition: filter 1s ease-in-out;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
        }

        /* 画面焼け防止: ピクセルシフト用コンテナ */
        #shift-container {
            width: 100%;
            height: 100%;
            transition: transform 1s ease-in-out;
        }

        /* レイアウトの切り替え用 Grid設定 */
        #grid-container {
            display: grid;
            gap: 0.5rem; /* 隙間を少し狭くしてスペース確保 */
            padding: 0.5rem; /* パディングも少し狭く */
            height: 100%;
            width: 100%;
            box-sizing: border-box;
            transition: all 1s ease-in-out;
        }

        /* パターン0: グラフ下部 */
        .layout-pattern-0 {
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: minmax(180px, 1fr) 2fr;
            grid-template-areas: 
                "current today seven"
                "graph graph graph";
        }

        /* パターン1: グラフ上部 */
        .layout-pattern-1 {
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 2fr minmax(180px, 1fr);
            grid-template-areas: 
                "graph graph graph"
                "current today seven";
        }

        /* パターン2: グラフ左側 */
        .layout-pattern-2 {
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-areas: 
                "graph current"
                "graph today"
                "graph seven";
        }

        /* パターン3: グラフ右側 */
        .layout-pattern-3 {
            grid-template-columns: 1fr 2fr;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-areas: 
                "current graph"
                "today graph"
                "seven graph";
        }

        /* コンテナクエリの定義 (血糖値の文字サイズ自動調整用) */
        .area-current { 
            grid-area: current; 
            container-type: inline-size;
        }

        /* 小さい画面用 (モバイル縦向き) の固定レイアウト */
        @media (max-width: 768px) {
            body {
                overflow-y: auto; /* モバイル縦向きの時だけはスクロール許可 */
            }
            #shift-container {
                height: auto; /* コンテンツの高さに合わせる */
                min-height: 100dvh;
            }
            #grid-container {
                display: flex;
                flex-direction: column;
                height: auto;
            }
            .area-graph { min-height: 300px; flex: none; order: 4; } /* グラフを一番下に */
            .area-current { min-height: 150px; order: 1; }
            .area-today { order: 2; }
            .area-seven { order: 3; }
            .panel { flex: none; margin-bottom: 0.5rem; }
            .panel:last-child { margin-bottom: 0; }
        }

        .area-today { grid-area: today; }
        .area-seven { grid-area: seven; }
        .area-graph { grid-area: graph; min-height: 0; min-width: 0; }

        /* パネルのスタイル */
        .panel {
            background-color: rgba(15, 23, 42, 0.75);
            border-radius: 1rem;
            border: 1px solid rgba(71, 85, 105, 0.4);
            padding: 0.5rem; /* パディングを少し減らす */
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(4px);
            overflow: hidden;
        }

        /* 動的フォントサイズ (コンテナの幅に依存) */
        .dynamic-bg-text {
            font-size: clamp(3rem, 25cqw, 10rem); /* 最小3rem, コンテナ幅の25%, 最大10rem */
            line-height: 1;
        }
        .dynamic-arrow-text {
            font-size: clamp(2rem, 18cqw, 8rem);
            line-height: 1;
        }

        /* 設定モーダル */
        #settings-modal {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
